
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة Alaoui Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>لوحة إدارة Alaoui Shop</h1>

<div id="login">
<form id="loginform">
<label>البريد الإلكتروني <input id="email" type="email" required></label>
<label>كلمة المرور <input id="password" type="password" required></label>
<button class="btn">دخول</button>
</form>
<p id="msg"></p>
</div>

<div id="dash" hidden>
<p>أنت داخل لوحة الإدارة.</p>

<h2>إعدادات المحل</h2>
<form id="settingsform">
<label>عنوان المحل
<input id="shopaddress" placeholder="عنوان المحل">
</label>
<label>رقم واتساب الحجز
<input id="bookingphone" type="tel">
</label>
<label>رقم واتساب الطلبات
<input id="orderphone" type="tel">
</label>
<button class="btn">حفظ الإعدادات</button>
</form>
<p id="settingsmsg"></p>

<button id="logout">خروج</button>

<hr>
<h2>🍽️ إدارة قائمة الطعام</h2>
<h3>إضافة منتج للطعام</h3>
<form id="productform">
<input id="name" placeholder="اسم المأكولة أو المشروب" required>
<input id="desc" placeholder="الوصف">
<input id="price" placeholder="الثمن" required>
<label>صورة المنتج
<input id="productImage" type="file" accept="image/*">
</label>
<button class="btn" type="submit">إضافة إلى قائمة الطعام</button>
</form>

<h3>منتجات قائمة الطعام</h3>
<div id="list"></div>

<hr>
<h2>🛍️ إدارة المتجر الإلكتروني</h2>
<h3>إضافة منتج جديد للمتجر</h3>
<form id="storeProductForm">
<input id="storeName" placeholder="اسم منتج المتجر" required>
<input id="storeDesc" placeholder="وصف المنتج">
<input id="storePrice" placeholder="الثمن" required>
<label>صورة منتج المتجر
<input id="storeProductImage" type="file" accept="image/*">
</label>
<button class="btn" type="submit">إضافة إلى المتجر</button>
</form>
<p id="storeProductMsg"></p>

<h3>منتجات المتجر الحالية</h3>
<div id="storeProductList"></div>

<hr>
<h2>إضافة صور للمعرض</h2>
<input id="images" type="file" accept="image/*" multiple>

<h3>صور المعرض الحالية</h3>
<p id="galleryMessage"></p>
<div id="galleryList"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
